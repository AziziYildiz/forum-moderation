<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Post Reports</title>
    <link rel="stylesheet" href="../static/admin.css">
</head>
<body>
    <div class="sidebar">
        <a href="/" class="logo-btn">
            <button class="logo-btn">
                <img src="/static/images/logok-rm-z-5copy-1.png" alt="Admin Dashboard">
            </button>
        </a>
        <button class="toggle-btn shared-background" onclick="toggleNotifications()">Toggle Notifications</button>

        <div class="notification-area">
            <h3>Notifications</h3>
            <ul>
                <li>
                    <a href="/admin?view=moderation_requests">
                        <button class="notification-btn">
                            Request for Moderation 
                            <span id="moderation-count">{{len .ModerationRequests}}</span>
                        </button>
                    </a>
                </li>
                <li>
                    <a href="/admin?view=post_reports">
                        <button class="notification-btn">
                            Moderator report 
                            <span id="post-sharing-count">{{len .Reports}}</span>
                        </button>
                    </a>
                </li>
            </ul>
        </div>
        <ul>
            <li><a href="/admin?view=users" class="shared-background">Users</a></li>
            <li><a href="/admin?view=posts" class="shared-background">Posts</a></li>
            <li><a href="/admin?view=comments" class="shared-background1">Comments</a></li>
        </ul>
    </div>
    <div class="content">
        <h1>Post Reports</h1>

        <div id="reports-section" class="section reports-content">
            <h2>Reports</h2>
            {{if .Reports}}
            <table>
                <tr>
                    <th>ID</th>
                    <th>Author ID</th>
                    <th>Username</th>
                    <th>Report</th>
                    <th>Created At</th>
                    <th>Action</th>
                </tr>
                {{range .Reports}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.UserID}}</td>
                    <td>{{.Username}}</td>
                    <td>{{.Content}}</td>
                    <td>{{.CreatedAt}}</td>
                    <td>
                        <form method="POST" action="/delete_post_report">
                            <input type="hidden" name="post_id" value="{{.ID}}">
                            <button type="submit" class="delete-btn">Delete Post</button>
                        </form>
                    </td>
                </tr>
                {{end}}
            </table>
            {{else}}
            <p>No reports found.</p>
            {{end}}
        </div>
    </div>
    <script>
        function toggleNotifications() {
            var notificationArea = document.querySelector('.notification-area');
            if (notificationArea.style.display === 'none' || notificationArea.style.display === '') {
                notificationArea.style.display = 'block';
            } else {
                notificationArea.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Update report count on page load
            updatePostSharingCount();
        });

        function updatePostSharingCount() {
            var postReportsSection = document.getElementById('reports-section');
            var count = postReportsSection.querySelectorAll('table tr').length - 1; // Exclude the header row
            document.getElementById('post-sharing-count').innerText = count;
        }

        document.querySelectorAll('.delete-btn').forEach(function(button) {
            button.addEventListener('click', function(event) {
                event.preventDefault();
                if (confirm('Are you sure you want to delete this post?')) {
                    var form = this.closest('form');
                    var postId = form.querySelector('input[name="post_id"]').value;
                    fetch('/delete_post_report', {
                        method: 'POST',
                        body: new URLSearchParams({ post_id: postId })
                    }).then(response => {
                        if (response.ok) {
                            form.closest('tr').remove();
                            updatePostSharingCount();
                        } else {
                            alert('Failed to delete post.');
                        }
                    }).catch(error => console.error('Error:', error));
                }
            });
        });
    </script>
</body>
</html>
