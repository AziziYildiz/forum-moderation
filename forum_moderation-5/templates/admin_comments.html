<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Admin Comments</title>
    <link rel="stylesheet" href="../static/admin.css">
</head>
<body>
    <div class="sidebar">
        <a href="/" class="logo-btn">
            <button class="logo-btn">
                <img src="/static/images/logok-rm-z-5copy-1.png" alt="Admin Dashboard">
            </button>
        </a>
        <button class="toggle-btn shared-background" onclick="toggleNotifications()">Toggle Notifications</button>
        <div class="notification-area" style="display: none;">
            <h3>Notifications</h3>
            <ul>
                <li>
                    <a href="/admin?view=moderation_requests">
                        <button class="notification-btn">
                            Request for Moderation 
                            <span id="moderation-count">{{len .ModerationRequests}}</span>
                        </button>
                    </a>
                </li>
                <li>
                    <a href="/admin?view=post_reports">
                        <button class="notification-btn">
                            Request for Post Sharing 
                            <span id="post-sharing-count">{{len .Reports}}</span>
                        </button>
                    </a>
                </li>
            </ul>
        </div>
        <ul>
            <li><a href="/admin?view=users" class="shared-background">Users</a></li>
            <li><a href="/admin?view=posts" class="shared-background">Posts</a></li>
            <li><a href="/admin?view=comments" class="shared-background1">Comments</a></li>
        </ul>
    </div>
    <div class="content">
        <h1>Admin Comments</h1>

        <div id="comments-section" class="section">
            <h2>Comments</h2>
            {{if .Comments}}
            <table>
                <tr>
                    <th>ID</th>
                    <th>Content</th>
                    <th>Author Name</th>
                    <th>Likes</th>
                    <th>Dislikes</th>
                    <th>Action</th>
                </tr>
                {{range .Comments}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.Content}}</td>
                    <td>{{.AuthorName}}</td>
                    <td>{{.Likes}}</td>
                    <td>{{.Dislikes}}</td>
                    <td>
                        <form method="POST" action="/admin/delete_comment">
                            <input type="hidden" name="comment_id" value="{{.ID}}">
                            <button type="submit" class="delete-btn">Delete</button>
                        </form>
                    </td>
                </tr>
                {{end}}
            </table>
            {{else}}
            <p>No comments found.</p>
            {{end}}
        </div>
    </div>
    <script>
        function toggleNotifications() {
            var notificationArea = document.querySelector('.notification-area');
            if (notificationArea.style.display === 'none' || notificationArea.style.display === '') {
                notificationArea.style.display = 'block';
                updateNotificationCounts();
            } else {
                notificationArea.style.display = 'none';
            }
        }

        function updateNotificationCounts() {
            fetch('/admin?view=notification_counts')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('moderation-count').textContent = data.moderationRequestsCount;
                    document.getElementById('post-sharing-count').textContent = data.postReportsCount;
                })
                .catch(error => console.error('Error fetching notification counts:', error));
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateNotificationCounts();
        });
    </script>
</body>
</html>
